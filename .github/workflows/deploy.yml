name: Deploy Automático para Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Compilar Next.js (Export Estático)
        run: npm run build

      - name: Enviar arquivos via FTP para a Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "set ftp:ssl-allow false; set net:timeout 60; set net:max-retries 5; cd public_html; mirror -R --overwrite --ignore-time ./out/ .; quit" -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER"
